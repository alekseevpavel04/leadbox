[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadbox"
version = "0.1.0"
description = "Mini CRM that collects leads from a Telegram bot and a connected Telegram Business account"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn[standard]"]

[project.optional-dependencies]
dev = ["httpx", "pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic letters in strings/comments are intended

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
